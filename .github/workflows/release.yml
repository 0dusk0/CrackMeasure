name: Build and Release CrackMeasure

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine package version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'v1.0.0-ci-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and package win-x64 portable bundle
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $dir = "dist/CrackMeasure-win-x64"
          $required = @(
            "$dir/CrackMeasure.exe",
            "$dir/crack_seg.onnx",
            "$dir/DirectML.dll",
            "$dir/onnxruntime.dll",
            "$dir/onnxruntime_providers_shared.dll",
            "$dir/OpenCvSharpExtern.dll",
            "$dir/samples/sample_01_crack.jpg",
            "$dir/README.md",
            "$dir/LICENSE"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }
          $forbidden = Get-ChildItem -Path $dir -Recurse -Include *.pdb,DirectML.Debug.*,onnxruntime.lib,opencv_videoio_ffmpeg*.dll,createdump.exe
          if ($forbidden) {
            throw "Unexpected bloat files found: $($forbidden.FullName -join ', ')"
          }
          Get-ChildItem -Path $dir | Format-Table Name, Length -AutoSize

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrackMeasure-${{ steps.ver.outputs.version }}-win-x64
          path: dist/CrackMeasure-${{ steps.ver.outputs.version }}-win-x64.zip

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CrackMeasure-${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: true
